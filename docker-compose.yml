version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gowider-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gowider
    ports:
      # Bound to localhost loopback only for secure local development
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gowider-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      # Bound to localhost loopback only for secure local development
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
