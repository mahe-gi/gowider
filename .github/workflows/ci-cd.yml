name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Continuous Integration (Lint, Typecheck, Unit Tests, Build)
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/gowider"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "ci-dummy-secret-at-least-32-characters-long"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      STORAGE_DRIVER: "local"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint analysis
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify production build
        run: npm run build
        env:
          NODE_ENV: production

  # Stage 2: Continuous Deployment to EC2
  cd:
    name: Deploy to EC2
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e

            DEPLOY_DIR="${{ secrets.EC2_DEPLOY_PATH || '/home/ec2-user/gowider' }}"
            echo "Navigating to deployment directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "Checking .env file..."
            if [ ! -f .env ]; then
              echo "Error: .env file not found in $DEPLOY_DIR"
              exit 1
            fi

            echo "Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building Docker containers..."
            docker compose -f docker-compose.prod.yml build

            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml run --rm web npm run db:migrate

            echo "Starting updated containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Pruning unused Docker images..."
            docker image prune -f

            echo "Running health check..."
            MAX_RETRIES=10
            COUNT=0
            until [ $COUNT -ge $MAX_RETRIES ]; do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed: HTTP 200 from /api/health"
                break
              fi
              echo "Waiting for service to become healthy (attempt $((COUNT+1))/$MAX_RETRIES)..."
              sleep 3
              COUNT=$((COUNT+1))
            done

            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Health check failed after $MAX_RETRIES attempts"
              docker compose -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi

            echo "Deployment completed successfully"
